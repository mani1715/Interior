# ===============================================================================
# Production Profile Configuration for Interior Design Platform API
# Activated via SPRING_PROFILES_ACTIVE=production
# ===============================================================================

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api/v1
server.shutdown=graceful

# Forwarded Headers from Reverse Proxy / Ingress (Render, ALB, Cloudflare, Nginx)
server.forward-headers-strategy=framework

# Error Handling — No stack traces or internal exception details exposed to clients
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Production Database & HikariCP Connection Pooling
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Production Database & HikariCP Connection Pooling
# Configurable via DB_POOL_MAX_SIZE or SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
# Phase 15 Sizing Formula: Max Pool Per Replica = (Managed DB max_connections - Reserved) / Backend Replicas
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:30000}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:20000}}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1200000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_THRESHOLD_MS:${SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD:30000}}
spring.datasource.hikari.pool-name=InteriorPlatformHikariPool

# JPA / Hibernate Production Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Production Migrations (Thread-safe database-locked startup migration)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# OpenAPI Documentation (Disabled in production by default)
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

# Security & CORS Defaults
app.security.dev-auth-enabled=false
app.security.session-cookie-name=__Host-session
app.security.session-cookie-secure=true
app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS:}

# OpenID Connect (OIDC) Authentication (Target: Google OIDC — Live Activation Deferred to Phase 15)
app.security.oidc.providers.google.issuer=${GOOGLE_OIDC_ISSUER:https://accounts.google.com}
app.security.oidc.providers.google.client-id=${GOOGLE_CLIENT_ID:}
app.security.oidc.providers.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.security.oidc.providers.google.authorization-uri=${GOOGLE_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
app.security.oidc.providers.google.token-uri=${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
app.security.oidc.providers.google.jwk-set-uri=${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
app.security.oidc.providers.google.redirect-uri=${GOOGLE_REDIRECT_URI:}
app.security.oidc.providers.google.scopes=openid,email,profile

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=interior-platform-api

# OpenTelemetry / OTLP Export (Provider-neutral telemetry export - Default Disabled; Activated in Phase 15)
management.otlp.metrics.export.enabled=${OTEL_METRICS_EXPORT_ENABLED:false}
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACING_ENDPOINT:}

# Production Logging Levels (Zero SQL bind parameter leakage, no debug logging)
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.com.interior.platform=INFO

# Cloudflare R2 / S3-Compatible Object Storage
app.storage.provider=${MEDIA_STORAGE_PROVIDER:S3_COMPATIBLE}
app.storage.s3.endpoint=${S3_ENDPOINT:}
app.storage.s3.region=${S3_REGION:auto}
app.storage.s3.access-key-id=${S3_ACCESS_KEY_ID:}
app.storage.s3.secret-access-key=${S3_SECRET_ACCESS_KEY:}
app.storage.s3.private-bucket=${S3_BUCKET_PRIVATE:interior-platform-media-private}
app.storage.s3.public-bucket=${S3_BUCKET_PUBLIC:interior-platform-media-public}
app.storage.public-base-url=${PUBLIC_MEDIA_BASE_URL:/api/v1/media/public}

# Privacy & Retention Configuration
app.privacy.export-ttl-days=${PRIVACY_EXPORT_TTL_DAYS:7}

# Production Malware Scanning & Upload Security (Fail-Closed Default)
app.media.security.scanner=${MALWARE_SCANNER_PROVIDER:disabled}
app.media.security.require-clean-scan=${REQUIRE_CLEAN_SCAN:true}
app.media.security.scan-timeout-ms=${MALWARE_SCAN_TIMEOUT_MS:10000}
app.media.security.max-scan-retries=${MALWARE_SCAN_MAX_RETRIES:2}
app.media.security.clamav.host=${CLAMAV_HOST:clamav}
app.media.security.clamav.port=${CLAMAV_PORT:3310}
app.media.security.clamav.connection-timeout-ms=${CLAMAV_CONNECT_TIMEOUT_MS:3000}
app.media.security.clamav.read-timeout-ms=${CLAMAV_READ_TIMEOUT_MS:10000}

# AI Visualizer & Interior Generation (Target: Google Vertex / Stability / Replicate — Live Activation Deferred to Phase 15)
interior.ai.enabled=${AI_VISUALIZER_ENABLED:true}
interior.ai.provider=${AI_PROVIDER:none}
interior.ai.api-key=${AI_API_KEY:}
interior.ai.endpoint=${AI_ENDPOINT:}
interior.ai.model=${AI_MODEL:interior-diffusion-v1}
interior.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:60}
interior.ai.max-retries=${AI_MAX_RETRIES:2}
interior.ai.daily-studio-limit=${AI_DAILY_STUDIO_LIMIT:20}
interior.ai.global-daily-budget-minor=${AI_GLOBAL_DAILY_BUDGET_MINOR:0}
interior.ai.default-studio-monthly-budget-minor=${AI_DEFAULT_STUDIO_MONTHLY_BUDGET_MINOR:0}
interior.ai.estimated-cost-per-generation-minor=${AI_ESTIMATED_COST_PER_GENERATION_MINOR:4}
interior.ai.pricing-currency=${AI_PRICING_CURRENCY:USD}
interior.ai.pricing-version=${AI_PRICING_VERSION:v1-default}

# Transactional Email Delivery (Target: Resend / AWS SES — Live Activation Deferred to Phase 15)
app.email.provider=${EMAIL_PROVIDER:disabled}
app.email.from-address=${EMAIL_FROM_ADDRESS:}
app.email.from-display-name=${EMAIL_FROM_NAME:Elégance}
app.email.reply-to=${EMAIL_REPLY_TO:}
app.email.max-retries=${EMAIL_MAX_RETRIES:3}
app.email.base-retry-delay-seconds=${EMAIL_BASE_RETRY_DELAY_SECONDS:60}
app.email.timeout-seconds=${EMAIL_TIMEOUT_SECONDS:15}
app.email.webhook-secret=${EMAIL_WEBHOOK_SECRET:}

# Resend Provider Candidate Settings
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.resend.api-url=${RESEND_API_URL:https://api.resend.com/emails}

# AWS SES Provider Candidate Settings
app.email.ses.region=${AWS_SES_REGION:us-east-1}
app.email.ses.configuration-set=${AWS_SES_CONFIGURATION_SET:}
app.email.ses.access-key-id=${AWS_SES_ACCESS_KEY_ID:}
app.email.ses.secret-access-key=${AWS_SES_SECRET_ACCESS_KEY:}
app.email.ses.endpoint=${AWS_SES_ENDPOINT:}

# Commercial Billing & Payment Gateways (Target: Razorpay / Stripe — Live Activation Deferred to Phase 15)
app.billing.provider=${BILLING_PROVIDER:disabled}
app.billing.grace-period-days=${BILLING_GRACE_PERIOD_DAYS:7}
app.billing.currency=${BILLING_CURRENCY:INR}

# Razorpay Provider Candidate Settings
app.billing.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.billing.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.billing.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.billing.razorpay.api-url=${RAZORPAY_API_URL:https://api.razorpay.com/v1}

# Stripe Provider Candidate Settings
app.billing.stripe.api-key=${STRIPE_API_KEY:}
app.billing.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.billing.stripe.api-url=${STRIPE_API_URL:https://api.stripe.com/v1}
app.billing.stripe.timestamp-tolerance-seconds=${STRIPE_TIMESTAMP_TOLERANCE_SECONDS:300}


