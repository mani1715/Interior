server.port=8080
server.servlet.context-path=/api/v1

# Database Configuration (PostgreSQL 18)
spring.datasource.url=jdbc:postgresql://localhost:5433/interior_design_dev
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
# Local Engineering Load-Test Pool Configuration (Configurable via Environment)
# NOTE: 30 is a local engineering stress-test setting, NOT a locked production capacity.
# In Phase 15, pool size must be budgeted based on managed DB max_connections / replica count.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:30}}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:30}}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:60000}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:20000}}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_THRESHOLD_MS:30000}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Security & CORS Defaults
spring.profiles.active=dev
app.security.dev-auth-enabled=true
app.security.allowed-origins=http://localhost:3000
app.security.session-cookie-name=__Host-session

# Spring Boot Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Privacy Configuration
app.privacy.export-ttl-days=7

# Media Upload Security & Malware Scanning Defaults
app.media.security.scanner=${MALWARE_SCANNER_PROVIDER:fake}
app.media.security.require-clean-scan=${REQUIRE_CLEAN_SCAN:true}
app.media.security.scan-timeout-ms=${MALWARE_SCAN_TIMEOUT_MS:10000}
app.media.security.max-scan-retries=${MALWARE_SCAN_MAX_RETRIES:2}
app.media.security.clamav.host=${CLAMAV_HOST:localhost}
app.media.security.clamav.port=${CLAMAV_PORT:3310}
app.media.security.clamav.connection-timeout-ms=${CLAMAV_CONNECT_TIMEOUT_MS:3000}
app.media.security.clamav.read-timeout-ms=${CLAMAV_READ_TIMEOUT_MS:10000}

# Commercial Billing & Payment Defaults (Phase 15 Provider Activation Pending)
app.billing.provider=${BILLING_PROVIDER:disabled}
app.billing.grace-period-days=${BILLING_GRACE_PERIOD_DAYS:7}
app.billing.currency=${BILLING_CURRENCY:INR}
app.billing.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.billing.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.billing.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.billing.stripe.api-key=${STRIPE_API_KEY:}
app.billing.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# AI Visualizer & Stability AI Configuration
interior.ai.enabled=${INTERIOR_AI_ENABLED:${AI_VISUALIZER_ENABLED:true}}
interior.ai.provider=${INTERIOR_AI_PROVIDER:${AI_PROVIDER:none}}
interior.ai.api-key=${INTERIOR_AI_API_KEY:${STABILITY_API_KEY:${AI_API_KEY:}}}
interior.ai.endpoint=${INTERIOR_AI_ENDPOINT:${AI_ENDPOINT:https://api.stability.ai}}
interior.ai.model=${INTERIOR_AI_MODEL:${AI_MODEL:stability-v2beta}}
interior.ai.daily-studio-limit=${INTERIOR_AI_DAILY_STUDIO_LIMIT:${AI_DAILY_STUDIO_LIMIT:20}}
interior.ai.grow-mask=${INTERIOR_AI_GROW_MASK:${AI_GROW_MASK:3}}



